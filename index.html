<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de filmes e séries</title>
  <link rel="stylesheet" href="./css/filmes.css" />
</head>

<body>

  <header class="cabecalho">
    <div>
      <h1 class="cabecalho__titulo"><span id="nome-do-sistema">—</span></h1>
      <p class="cabecalho__subtitulo"><span id="versao">—</span> · <span id="data-de-hoje">—</span></p>
    </div>
    <div class="cabecalho__acoes">
      <span id="usuario-nome"></span>
      <button class="botao botao--pequeno" id="botao-sair" type="button" hidden>Sair</button>
    </div>
  </header>

  <section class="entrada" id="tela-entrada">
    <form class="formulario" id="form-entrar">
      <h2>Entrar</h2>
      <div class="campo">
        <label class="campo__rotulo" for="entrar-email">E-mail</label>
        <input class="campo__entrada" id="entrar-email" type="email" maxlength="80" autocomplete="email" required />
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="entrar-senha">Senha</label>
        <input class="campo__entrada" id="entrar-senha" type="password" minlength="6" maxlength="72"
          autocomplete="current-password" required />
      </div>
      <button class="botao botao--primario" type="submit">Entrar</button>
    </form>

    <form class="formulario" id="form-criar" hidden>
      <h2>Criar conta</h2>
      <div class="campo">
        <label class="campo__rotulo" for="criar-nome">Nome</label>
        <input class="campo__entrada" id="criar-nome" type="text" maxlength="80" autocomplete="name" required />
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="criar-email">E-mail</label>
        <input class="campo__entrada" id="criar-email" type="email" maxlength="80" autocomplete="email" required />
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="criar-senha">Senha (6 a 72 caracteres)</label>
        <input class="campo__entrada" id="criar-senha" type="password" minlength="6" maxlength="72"
          autocomplete="new-password" required />
      </div>
      <button class="botao botao--primario" type="submit">Criar conta</button>
    </form>
    <button class="botao botao--pequeno" id="alternar-entrada" type="button">Ainda não tenho conta</button>
    <p class="campo__erro" id="erro-entrada" role="alert"></p>
  </section>

  <main id="tela-app" hidden>
    <ul class="estatisticas">
      <li class="estatistica"><span class="estatistica__numero" id="total">0</span><span
          class="estatistica__rotulo">Total</span></li>
      <li class="estatistica"><span class="estatistica__numero" id="assistidos">0</span><span
          class="estatistica__rotulo">Assistidos</span></li>
      <li class="estatistica"><span class="estatistica__numero" id="assistindo">0</span><span
          class="estatistica__rotulo">Assistindo</span></li>
      <li class="estatistica"><span class="estatistica__numero" id="pendentes">0</span><span
          class="estatistica__rotulo">Para Assistir</span></li>
    </ul>

    <form class="formulario" id="formulario">
      <div class="campo">
        <label class="campo__rotulo" for="titulo">Título</label>
        <input class="campo__entrada" id="titulo" type="text" autocomplete="off" required />
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="status">Status</label>
        <select class="campo__selecao" id="status">
          <option value="quero ver">Quero Ver</option>
          <option value="assistindo" selected>Assistindo</option>
          <option value="assisti">Assisti</option>
        </select>
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="tipo">Tipo</label>
        <select class="campo__selecao" id="tipo">
          <option value="filme">Filme</option>
          <option value="serie" selected>Série</option>
        </select>
      </div>
      <div class="campo campo--generos">
        <label class="campo__rotulo" for="generos">Gêneros</label>
        <select class="campo__selecao" id="generos" multiple size="3" aria-describedby="ajuda-generos"></select>
        <small id="ajuda-generos">Use Ctrl (Windows) ou Command (Mac) para selecionar mais de um.</small>
      </div>
      <button class="botao botao--primario" type="submit">Cadastrar</button>
    </form>
    <p class="campo__erro" id="erro" role="alert"></p>
    <div class="campo">
      <label class="campo__rotulo" for="busca">Pesquisar por título</label>
      <input class="campo__entrada" id="busca" type="search" placeholder="Digite um título..." autocomplete="off" />
    </div>

    <div id="filtros-status">
      <button class="botao botao--primario" type="button" data-status="todos">Todos</button>
      <button class="botao" type="button" data-status="quero ver">Quero Ver</button>
      <button class="botao" type="button" data-status="assistindo">Assistindo</button>
      <button class="botao" type="button" data-status="assisti">Assisti</button>
    </div>
    <ul class="lista" id="lista"></ul>
  </main>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
